name: CI

# Trigger CI once for each PR update (on merge diff) and again when PR is merged to main (in push)
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read # allows reading repo contents (needed for basic CI)
  issues: read # allows reading action metadata (e.g., cache)
  packages: write # required to push to GHCR using GITHUB_TOKEN

env:
  REGISTRY: ghcr.io # GitHub Container Registry
  CARGO_TERM_COLOR: always # force colored output in logs
  CARGO_INCREMENTAL: 0 # disable incremental compilation for faster from-scratch builds

# Ensure only one run per branch/PR; cancel redundant ones
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # PYTHON CI
  # ============================================================================

  python_lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python with PDM
        uses: ./.github/actions

      - name: Run linter
        run: make lint

  python_format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python with PDM
        uses: ./.github/actions

      - name: Run formatter check
        run: pdm run ruff format --check

  python_unit_tests:
    runs-on: ubuntu-latest
    needs: [python_lint, python_format]
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python with PDM
        uses: ./.github/actions

      - name: Run unit tests
        run: PYTHONPATH=src make unit-tests

  python_integration_tests:
    runs-on: ubuntu-latest
    needs: [python_unit_tests]
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python with PDM
        uses: ./.github/actions

      - name: Run integration tests
        run: PYTHONPATH=src make integration-tests

  # ============================================================================
  # RUST CI
  # ============================================================================

  rust_fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check format
        run: cargo fmt --check

  rust_unused_dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Check for unused dependencies
        run: cargo machete

  rust_audit_dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit --color always

  rust_lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check for clippy warnings
        run: cargo clippy --all-targets --all-features --color always -- -D warnings

  rust_unit_tests:
    runs-on: ubuntu-latest
    needs:
      [rust_fmt, rust_audit_dependencies, rust_unused_dependencies, rust_lint]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        run: cargo test --lib --color always -- --nocapture

  rust_integration_tests:
    runs-on: ubuntu-latest
    needs: [rust_unit_tests]
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URI: "mongodb://root:example@localhost:27017/"
      MONGO_DB_NAME: "ai_code_explorer"

    services:
      mongodb:
        image: mongo:8.0.4
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Wait for MongoDB to be ready
        run: |
          # Simple check using netcat instead of mongosh
          until nc -z localhost 27017; do
            echo "Waiting for MongoDB..."
            sleep 2
          done
          echo "MongoDB is ready!"

      - name: Integration tests
        run: cargo test --test integration_tests_* --color always -- --nocapture

  # ============================================================================
  # Containerize Services (BUILD + PUSH)
  # ============================================================================

  containerize_services:
    needs: [python_integration_tests, rust_integration_tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: ai-code-explorer-ai-service
            context: ai-service
            dockerfile: ai-service/Dockerfile
          - image_name: ai-code-explorer-backend
            context: backend
            dockerfile: backend/Dockerfile
          - image_name: ai-code-explorer-frontend
            context: frontend
            dockerfile: frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Only required when pushing images (main branch)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Uses the automatic GITHUB_TOKEN (requires packages: write).
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        # Only required when pushing images (main branch)
        if: github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            # Tags: short SHA + latest (default branch only)
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push images to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }} # build context directory
          file: ${{ matrix.dockerfile }} # Dockerfile path
          push: ${{ github.ref == 'refs/heads/main' }} # push only on main
          tags: ${{ steps.meta.outputs.tags }} # set only on main
          labels: ${{ steps.meta.outputs.labels }} # set only on main
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true # publish build provenance/attestation
          build-args: ${{ matrix.image_name == 'ai-code-explorer-frontend' && 'VITE_BACKEND_API_URL=/api' || '' }} # frontend build-time arg
