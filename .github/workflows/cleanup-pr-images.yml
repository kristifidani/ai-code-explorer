name: Cleanup PR Images

# Automatically delete GHCR images when PRs are closed/merged
on:
  pull_request:
    types: [closed]

permissions:
  packages: write # Required to delete package versions
  contents: read # Required for basic repo access

jobs:
  cleanup_pr_images:
    name: Delete PR images from GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Delete images for closed PR
        run: |
          set -uo pipefail  # Exit on undefined vars, pipe failures

          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO_OWNER="${{ github.repository_owner }}"

          echo "🧹 Cleaning up GHCR images for PR #${PR_NUMBER}"

          # Define the services that publish images
          declare -a SERVICES=(
            "ai-code-explorer-ai-service"
            "ai-code-explorer-backend" 
            "ai-code-explorer-frontend"
          )

          # Process each service
          for SERVICE in "${SERVICES[@]}"; do
            echo "🔍 Processing ${SERVICE}..."
            
            # Find all image versions published for this PR
            # This includes both pr-X tags and SHA tags from the same build
            PACKAGE_VERSIONS=$(gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/users/${REPO_OWNER}/packages/container/${SERVICE}/versions" \
              --jq --arg pr "${PR_NUMBER}" '
                # First, find versions with pr-X tags
                [.[] | select(.metadata.container.tags[]? | test("^pr-" + $pr + "$"))] as $pr_versions |
                # Get their creation timestamps  
                [$pr_versions[].created_at] as $pr_times |
                # Find all versions created at those same times (includes SHA tags)
                [.[] | select(.created_at as $time | $pr_times | index($time))] |
                # Return all IDs
                .[].id
              ' 2>/dev/null || echo "")
            
            if [ -z "$PACKAGE_VERSIONS" ]; then
              echo "  ℹ️  No images found tagged pr-${PR_NUMBER}"
              continue
            fi
            
            # Delete each found version
            while IFS= read -r VERSION_ID; do
              if [ -n "$VERSION_ID" ]; then
                echo "  🗑️  Deleting version: ${VERSION_ID}"
                if gh api \
                  --method DELETE \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "/users/${REPO_OWNER}/packages/container/${SERVICE}/versions/${VERSION_ID}" \
                  --silent 2>/dev/null; then
                  echo "  ✅ Successfully deleted version ${VERSION_ID}"
                else
                  echo "  ⚠️  Failed to delete version ${VERSION_ID} (may already be deleted)"
                fi
              fi
            done <<< "$PACKAGE_VERSIONS"
          done

          echo "✅ Cleanup completed for PR #${PR_NUMBER}"
        env:
          # GitHub CLI uses this token for authentication
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
