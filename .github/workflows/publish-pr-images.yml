name: Publish PR Images

on:
    pull_request:
        branches:
            - main
        types: [labeled, synchronize]

permissions:
    contents: read
    packages: write

env:
    REGISTRY: ghcr.io

concurrency:
    group: publish-pr-images-pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    publish_pr_images:
        name: Build & push PR images to GHCR
        runs-on: ubuntu-latest
        # Manual trigger: apply label "publish-images".
        # Safe by default: only same-repo PRs can publish (never forks).
        # Run if: labeled with publish-images OR (synchronize AND label exists)
        if: >
            github.event.pull_request.head.repo.full_name == github.repository &&
            (
                (github.event.action == 'labeled' && github.event.label.name == 'publish-images') ||
                (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'publish-images'))
            )

        strategy:
            fail-fast: false
            matrix:
                include:
                    - image_name: ai-code-explorer-ai-service
                      context: ai-service
                      dockerfile: ai-service/Dockerfile
                      build_args: ""
                    - image_name: ai-code-explorer-backend
                      context: backend
                      dockerfile: backend/Dockerfile
                      build_args: ""
                    - image_name: ai-code-explorer-frontend
                      context: frontend
                      dockerfile: frontend/Dockerfile
                      build_args: |
                          VITE_BACKEND_API_URL=/api

        steps:
            - name: Checkout PR HEAD
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}
                  tags: |
                      type=sha,format=short,prefix=pr-${{ github.event.pull_request.number }}-

            - name: Build and push PR images
              uses: docker/build-push-action@v6
              with:
                  context: ${{ matrix.context }}
                  file: ${{ matrix.dockerfile }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  provenance: false
                  sbom: false
                  build-args: ${{ matrix.build_args }}
