# NOTE
# if you have 2fa on your account, the pr close part of the action will hang (due to 2fa not being supported non-interactively)

name: Manage PR Environments (Railway)

on:
  pull_request:
    types: [opened, synchronize, closed]

concurrency:
  group: railway-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Account token
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
  # ID of the Railway project
  LINK_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
  # ID of 'preview' environment, which acts as a template
  DUPLICATE_FROM_ID: ${{ vars.RAILWAY_PREVIEW_ENVIRONMENT_ID }}

  # Service IDs for CODE-BASED preview services
  PREVIEW_AI_SVC_ID: ${{ vars.PREVIEW_AI_SERVICE_ID }}
  PREVIEW_BACKEND_SVC_ID: ${{ vars.PREVIEW_BACKEND_SERVICE_ID }}
  PREVIEW_FRONTEND_SVC_ID: ${{ vars.PREVIEW_FRONTEND_SERVICE_ID }}

jobs:
  pr_opened_or_updated:
    # Don't run with secrets on PRs from forks.
    if: (github.event.action == 'opened' || github.event.action == 'synchronize') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:4.23.2
    steps:
      - uses: actions/checkout@v4

      - name: Link Railway CLI to preview environment (for initial context)
        run: railway link --project ${{ env.LINK_PROJECT_ID }} --environment ${{ env.DUPLICATE_FROM_ID }}

      - name: Create PR environment (copy service structure from preview)
        run: railway environment new pr-${{ github.event.pull_request.number }} --copy ${{ env.DUPLICATE_FROM_ID }} || true

      - name: Switch Railway CLI context to the new PR environment
        run: railway link --project ${{ env.LINK_PROJECT_ID }} --environment pr-${{ github.event.pull_request.number }}

      - name: Deploy AI Service to PR environment
        working-directory: ai-service
        run: railway up --service=${{ env.PREVIEW_AI_SVC_ID }} --project ${{ env.LINK_PROJECT_ID }} --environment pr-${{ github.event.pull_request.number }}

      - name: Deploy Backend to PR environment
        working-directory: backend
        run: railway up --service=${{ env.PREVIEW_BACKEND_SVC_ID }} --project ${{ env.LINK_PROJECT_ID }} --environment pr-${{ github.event.pull_request.number }}

      - name: Deploy Frontend to PR environment
        working-directory: frontend
        run: railway up --service=${{ env.PREVIEW_FRONTEND_SVC_ID }} --project ${{ env.LINK_PROJECT_ID }} --environment pr-${{ github.event.pull_request.number }}

  pr_closed:
    # Don't run with secrets on PRs from forks.
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:4.23.2
    steps:
      - name: Link Railway CLI to project (for cleanup context)
        run: railway link --project ${{ env.LINK_PROJECT_ID }} --environment ${{ env.DUPLICATE_FROM_ID }}

      - name: Delete PR environment
        run: railway environment delete pr-${{ github.event.pull_request.number }} || true
