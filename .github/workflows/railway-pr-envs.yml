# NOTE
# if you have 2fa on your account, the pr close part of the action will hang (due to 2fa not being supported non-interactively)

name: Deploy Railway PR Environment

on:
  pull_request:
    types: [opened, synchronize, closed]

concurrency:
  group: railway-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Account token
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
  # ID of the Railway project
  LINK_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
  # ID of 'preview' environment, which acts as a template
  DUPLICATE_FROM_ID: ${{ vars.RAILWAY_PREVIEW_ENVIRONMENT_ID }}

  # Service IDs for CODE-BASED preview services
  PREVIEW_AI_SVC_ID: ${{ vars.PREVIEW_AI_SERVICE_ID }}
  PREVIEW_BACKEND_SVC_ID: ${{ vars.PREVIEW_BACKEND_SERVICE_ID }}
  PREVIEW_FRONTEND_SVC_ID: ${{ vars.PREVIEW_FRONTEND_SERVICE_ID }}

jobs:
  setup_pr_environment:
    # Don't run with secrets on PRs from forks.
    if: (github.event.action == 'opened' || github.event.action == 'synchronize') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:4.23.2
    steps:
      - name: Link Railway CLI to preview environment (for initial context)
        run: railway link --project ${{ env.LINK_PROJECT_ID }} --environment ${{ env.DUPLICATE_FROM_ID }}

      - name: Create PR environment (copy service structure from preview)
        run: |
          # Try to create the PR environment. If it already exists (e.g. on synchronize), check for its presence.
          # Railway's API is eventually consistent: the environment may appear in the list before it's fully ready for linking/deploying.
          # The wait below is a defensive measure to avoid race conditions and CI flakiness.
          railway environment new pr-${{ github.event.pull_request.number }} --copy ${{ env.DUPLICATE_FROM_ID }} || {
            railway environment list | grep -q "pr-${{ github.event.pull_request.number }}" || exit 1
            echo "Environment already exists, waiting for consistency..."
            sleep 10
          }

      - name: Wait for PR environment to be ready (retry link)
        run: |
          # Retry linking to the environment in case it's not immediately available after creation/listing.
          for i in {1..5}; do
            railway link --project ${{ env.LINK_PROJECT_ID }} --environment pr-${{ github.event.pull_request.number }} && break
            echo "Retrying link... ($i)"
            sleep 5
          done

  deploy_services:
    needs: setup_pr_environment
    if: (github.event.action == 'opened' || github.event.action == 'synchronize') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:4.23.2
    strategy:
      matrix:
        include:
          - service_id: ${{ vars.PREVIEW_AI_SERVICE_ID }}
            working_dir: ai-service
            service_name: AI Service
          - service_id: ${{ vars.PREVIEW_BACKEND_SERVICE_ID }}
            working_dir: backend
            service_name: Backend
          - service_id: ${{ vars.PREVIEW_FRONTEND_SERVICE_ID }}
            working_dir: frontend
            service_name: Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Switch Railway CLI context to PR environment
        run: railway link --project ${{ env.LINK_PROJECT_ID }} --environment pr-${{ github.event.pull_request.number }}

      - name: Deploy ${{ matrix.service_name }} to PR environment
        working-directory: ${{ matrix.working_dir }}
        run: railway up --service=${{ matrix.service_id }} --project ${{ env.LINK_PROJECT_ID }} --environment pr-${{ github.event.pull_request.number }}

      - name: Verify ${{ matrix.service_name }} deployment status
        run: |
          echo "Waiting for ${{ matrix.service_name }} deployment to complete..."
          sleep 30
          railway status --service=${{ matrix.service_id }} --project ${{ env.LINK_PROJECT_ID }} --environment pr-${{ github.event.pull_request.number }}

  pr_closed:
    # Don't run with secrets on PRs from forks.
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: ghcr.io/railwayapp/cli:4.23.2
    steps:
      - name: Link Railway CLI to project (for cleanup context)
        run: railway link --project ${{ env.LINK_PROJECT_ID }} --environment ${{ env.DUPLICATE_FROM_ID }}

      - name: Delete PR environment
        run: railway environment delete pr-${{ github.event.pull_request.number }}
