services:
  ollama:
    ports:
      - "11434:11434"

  mongo:
    ports:
      - "27017:27017"
    env_file:
      - .env.docker

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - ./ai-service/chroma_store:/app/chroma_store

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env.docker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_API_URL: /api
    ports:
      - "5173:8080"
