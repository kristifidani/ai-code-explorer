services:
  # Infrastructure services
  mongo:
    image: mongo:8.0.4
    restart: unless-stopped
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db

  # Application services
  ai-service:
    image: ghcr.io/kristifidani/ai-code-explorer-ai-service:local
    build: 
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./ai-service/chroma_store:/app/chroma_store
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  backend:
    image: ghcr.io/kristifidani/ai-code-explorer-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      RUST_BACKEND_PORT: 8080
      RUST_LOG: info
      MONGO_URI: mongodb://root:example@mongo:27017
      MONGO_DB_NAME: ai_code_explorer
      AI_SERVICE_URL: http://ai-service:8000
      # Browser-origin CORS (host browser → container)
      FRONTEND_API_URL: http://localhost:5173
    depends_on: 
      mongo:
        condition: service_started
      ai-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/kristifidani/ai-code-explorer-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_API_URL: /api
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:5173/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongo_data: