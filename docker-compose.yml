services:
  # Infrastructure services
  ollama:
    image: ollama/ollama:0.13.5
    ports:
      - "11434:11434"
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 2
      start_period: 20s

  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - 27017:27017
    env_file:
      - .env.docker
    volumes:
      - mongo_data:/data/db

  # Application services
  ai-service:
    image: ghcr.io/kristifidani/ai-code-explorer-ai-service:latest
    build: 
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - ./ai-service/chroma_store:/app/chroma_store
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  backend:
    image: ghcr.io/kristifidani/ai-code-explorer-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env.docker
    depends_on: 
      mongo:
        condition: service_started
      ai-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/kristifidani/ai-code-explorer-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_API_URL: /api
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  ollama_data:
  mongo_data: