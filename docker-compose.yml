services:
  # Infrastructure
  ollama:
    image: ollama/ollama:0.13.5
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 2
      start_period: 20s

  mongo:
    image: mongo:8.0.4
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Application services
  ai-service:
    image: ghcr.io/kristifidani/ai-code-explorer-ai-service:latest
    restart: unless-stopped
    volumes:
      - ai_chroma:/app/chroma_store
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  backend:
    image: ghcr.io/kristifidani/ai-code-explorer-backend:latest
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_started
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/kristifidani/ai-code-explorer-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  ollama_data:
  mongo_data:
  ai_chroma:
