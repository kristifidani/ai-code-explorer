# What this file does:
# 1) Serves the built frontend (static files from /usr/share/nginx/html)
# 2) Proxies /api/* requests to the backend service inside the Docker network
# 3) Provides SPA routing fallback so deep links work (serves index.html)
    
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reduce info leakage
    server_tokens off;

    # --- Security headers (safe defaults for SPAs) ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse proxy API requests to the Rust backend.
    # /api/v1/... -> http://backend:8080/v1/...
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Cache immutable build assets aggressively ---
    # Vite typically emits hashed filenames under /assets/
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Also cache common static file types if they exist outside /assets/
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- SPA routing ---
    # Do NOT cache index.html aggressively; it changes between deployments and
    # references the correct hashed asset filenames.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
