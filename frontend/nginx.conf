 # What this file does:
    # 1) Serves the built frontend (static files from /usr/share/nginx/html)
    # 2) Proxies /api/* requests to the backend service inside the Docker network
    # 3) Provides SPA routing fallback so deep links work (serves index.html)
    
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy API requests to the Rust backend.
    # /api/v1/... -> http://backend:8080/v1/...
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing (React Router / client-side routes)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
