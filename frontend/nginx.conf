# What this file does:
# 1) Serves the built frontend (static files from /usr/share/nginx/html)
# 2) Proxies /api/* requests to the backend (configured via BACKEND_URL at runtime)
# 3) Provides SPA routing fallback so deep links work (serves index.html)
    
server {
    # Railway (and many PaaS providers) inject $PORT at runtime.
    # This file is rendered at container start via envsubst.
    listen ${PORT};
    listen [::]:${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reduce info leakage
    server_tokens off;

    # --- Security headers (safe defaults for SPAs) ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse proxy API requests to the Rust backend.
    # This file is treated as a template and rendered at container start via envsubst.
    # /api/v1/... -> ${BACKEND_URL}/v1/...
    location /api/ {
        # RAG/LLM calls can take longer than the default NGINX upstream timeouts.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        send_timeout 120s;

        proxy_pass ${BACKEND_URL}/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing (React Router / client-side routes)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
